general {
    # Avoid launching several simultaneous lock screens.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock the session before any externally requested suspension.
    before_sleep_cmd = loginctl lock-session

    # Restore the displays after resuming.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    # Lock after five minutes without activity.
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    # Turn displays off thirty seconds after locking.
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
