# HP OMEN initial monitor profile.
#
# This catch-all rule asks Hyprland to use each output's preferred mode.
# Replace it after checking:
#
#   hyprctl monitors all
#
# Example future rules:
#
# monitor = eDP-1, preferred, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@240, 1920x0, 1


monitor = eDP-1, 1920x1200@165.00000, 0x0, 1

# monitor = , preferred, auto, 1
