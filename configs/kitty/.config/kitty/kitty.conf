# ============================================================
# DARK GLASS THEME
# ============================================================


# === BACKGROUND / FOREGROUND ===

# Dark neutral tint designed to remain readable over wallpaper.
background              #111318
foreground              #E3E5E8

selection_background    #3A3D46
selection_foreground    #F5F6F7

cursor                  #F0F0F0
cursor_text_color       #111318

# URL underline color when hovering with mouse.
url_color               #86A8D8


# === GLASS EFFECT ===

# Dark translucent surface.
background_opacity      0.6

# Allow Kitty's opacity shortcuts to work.
dynamic_background_opacity yes

# Request compositor background blur on Wayland.
# Hyprland controls the actual blur appearance.
background_blur         1


# ============================================================
# ANSI TERMINAL COLORS
#
# Muted rather than highly saturated so that shell output,
# git, compilers, prompts, etc. retain semantic coloring while
# matching the dark macOS-like desktop.
# ============================================================


# Black / neutral
color0  #202329
color8  #5D626B

# Red - errors / failures
color1  #D97880
color9  #E88A92

# Green - success / strings
color2  #8CBF8C
color10 #9DCF9D

# Yellow - warnings / numbers
color3  #D2AE6D
color11 #E1C17F

# Blue - directories / information
color4  #789FD0
color12 #8CB2E3

# Magenta - special values / metadata
color5  #AD8BC9
color13 #BE9CDA

# Cyan - paths / secondary information
color6  #72B3B4
color14 #85C5C6

# White
color7  #C9CCD1
color15 #F2F3F4


# ============================================================
# WINDOW STYLING
# ============================================================

window_padding_width 14

# Keep the existing font behavior.
#font_family JetBrainsMono Nerd Font Mono

bold_font auto
italic_font auto
bold_italic_font auto

font_size 11.0
